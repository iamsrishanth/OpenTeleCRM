; OpenTeleCRM — Asterisk ARI configuration (template, not live wiring).
;
; ARI (Asterisk REST Interface) is served by the res_ari_* modules over the
; Asterisk HTTP server (see /etc/asterisk/http.conf). There is NO separate
; 'asterisk-ari' package on Debian — res_ari is bundled with the 'asterisk'
; package and enabled via modules.conf (see provision/asterisk.sh).
;
; The API service (services/telephony ARI client) consumes:
;   ARI URL   : http://127.0.0.1:8088/ari   (HTTP basic auth)
;   ARI user  : opentelecrm
;   Stasis app: opentelecrm                 (subscribed over the ARI websocket)

[general]
; Enable the ARI interface entirely.
enabled = yes

; Pretty-print JSON responses (human debugging; drop in prod for size).
pretty = yes

; CORS origins allowed to call ARI from browsers. The API's ARI client is
; server-side (no CORS needed). Keep '*' only for localhost browser tooling
; (e.g. Swagger UI, ari-stats); restrict to your origin in production.
allowed_origins = *

; ---------------------------------------------------------------------------
; ARI users. Section name == HTTP basic-auth username.
; Password is stored CLEARTEXT here (Asterisk requirement) — never commit a
; real one. The provision script replaces the placeholder below from the
; ARI_PASSWORD environment variable:
;
;     ARI_PASSWORD='<secret>' bash infra/asterisk/provision/asterisk.sh
;
; For production, template this file from your secret store and keep it
; root/asterisk-readable only (the provision script deploys 0644 asterisk:asterisk).
; ---------------------------------------------------------------------------
[opentelecrm]
type = user
; Placeholder — replaced by provision/asterisk.sh (sed) from $ARI_PASSWORD.
password = __ARI_PASSWORD__
; read_only = no means this user may dial channels, start recordings, etc.
; The OpenTeleCRM API needs write access (channel originate, record start/stop),
; so keep this 'no'.
read_only = no
