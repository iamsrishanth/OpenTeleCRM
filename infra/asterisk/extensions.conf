; OpenTeleCRM — minimal dialplan (template, not live wiring).
;
; Two contexts:
;   [from-crm]  calls originated by the CRM (via ARI, PJSIP/from-crm endpoint)
;   [from-pstn] inbound calls from SIP trunks (pjsip.conf [trunk-example])
;
; HOW CRM EVENTS FIRE: the API's ARI client (services/telephony) connects to
; Asterisk's ARI websocket and subscribes to the Stasis application
; 'opentelecrm'. When the dialplan dials Stasis/opentelecrm, the channel is
; handed to that application and Asterisk emits Stasis events (StasisStart,
; ChannelStateChange, StasisEnd, ...) over the websocket. The API maps those
; into CRM events (call.ringing, call.answered, call.ended, recording.*).
;
; The placeholder contexts below work WITHOUT the API (sanity test the PBX);
; swap the middle lines for Dial(Stasis/opentelecrm) once services/telephony
; is up. If no process has subscribed to the app, Dial(Stasis/...) fails —
; that is expected until the API's ARI client is running.
;
; After editing:  sudo asterisk -rx "dialplan reload"

; ---------------------------------------------------------------------------
; CRM-originated calls. The API's ARI client originates channels against the
; 'from-crm' endpoint (pjsip.conf), they land here, and the Stasis() dialplan
; app hands the channel to the 'opentelecrm' app. The API (services/telephony
; ARI client) subscribes to that app over the ARI websocket and receives
; StasisStart / ChannelStateChange / ChannelDestroyed events, which it maps
; into CRM events (call.ringing, call.answered, call.ended, recording.*).
; NB: Asterisk 20+ removed the Stasis channel tech — use Stasis(app), NOT
; Dial(Stasis/app) (which fails with "No channel type registered for 'Stasis'").
; ---------------------------------------------------------------------------
[from-crm]
exten => _X.,1,NoOp(OpenTeleCRM outbound call to ${EXTEN})
 same => n,Stasis(opentelecrm)
 same => n,Hangup()
; E.164 originate (lead identifiers are +9191...): strip the + and run the
; same Stasis path.
exten => _+X.,1,NoOp(OpenTeleCRM outbound call to ${EXTEN})
 same => n,Stasis(opentelecrm)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; Inbound calls from SIP trunks (endpoint 'context = from-pstn' in pjsip.conf).
; Task-order baseline: answer, welcome prompt, hang up.
; ---------------------------------------------------------------------------
[from-pstn]
exten => _X.,1,NoOp(OpenTeleCRM inbound call from ${CHANNEL} to ${EXTEN})
 same => n,Answer()
 same => n,Playback(welcome)     ; from asterisk-core-sounds-en
 same => n,NoOp(Inbound answered — CRM agent/IVR comes later)
;
; --- Stasis hook-in point ------------------------------------------------
; Same pattern as from-crm — hand the inbound channel to the API:
;     same => n,Dial(Stasis/opentelecrm)
; -------------------------------------------------------------------------
 same => n,Hangup()
