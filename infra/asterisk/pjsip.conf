; OpenTeleCRM — chan_pjsip configuration (template, not live wiring).
;
; chan_pjsip is the only SIP channel driver in Asterisk 21 (chan_sip was
; removed). It is enabled by loading res_pjsip + chan_pjsip (modules.conf —
; autoload=yes covers it; provision/asterisk.sh adds explicit load lines).
;
; Files in /etc/asterisk are compiled at startup — after editing run:
;     sudo asterisk -rx "pjsip reload"

; ---------------------------------------------------------------------------
; Transport — where SIP media/signalling listens. All inbound trunks and
; endpoints in this file must reference a transport.
; NOTE: binding 0.0.0.0 here is normal for SIP (this is the PBX's listening
; socket, firewalled by the host). ARI, in contrast, MUST stay on loopback —
; see ari.conf / http.conf. If the PBX is exposed, put it behind your host
; firewall or a private network; never expose SIP to the public internet.
; ---------------------------------------------------------------------------
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; allow_reload = yes   ; reload transport options without restarting

; ---------------------------------------------------------------------------
; TRUNK TEMPLATE (example — commented out, uncomment + fill for a real SIP
; trunk, e.g. a PSTN/SIP provider). Three objects work as a set:
;
;   endpoint  : the logical peer, its auth and AOR names below
;   auth      : credentials for outbound registration / inbound challenge
;   aor       : Address Of Record — where the peer is reachable
;
; Inbound calls from the trunk land in the context named by 'context'
; (here: from-pstn, defined in extensions.conf).
; ---------------------------------------------------------------------------
;[trunk-example]
;type = endpoint
;context = from-pstn
;disallow = all
;allow = ulaw
;allow = alaw
;direct_media = no            ; force media through the PBX (recording!)
;rtp_symmetric = yes
;force_rport = yes
;rewrite_contact = yes
;aors = trunk-example-aor
;auth = trunk-example-auth
;outbound_auth = trunk-example-auth

;[trunk-example-auth]
;type = auth
;auth_type = userpass
;username = trunk-example        ; username the provider expects
;password = CHANGE_ME_TRUNK_PASSWORD   ; provider secret — from env/secret store

;[trunk-example-aor]
;type = aor
;max_contacts = 1                ; static trunk: single registration

; ---------------------------------------------------------------------------
; CRM-originated calls. The API's ARI client originates channels against this
; endpoint (via POST /ari/channels with endpoint: PJSIP/from-crm/... or by
; dialing its AOR) — the calls land in the 'from-crm' context
; (extensions.conf), where the dialplan decides: play a beep and answer, or
; hand the channel to the Stasis app 'opentelecrm' for the API to control.
; ---------------------------------------------------------------------------
[from-crm]
type = endpoint
context = from-crm
disallow = all
allow = ulaw
allow = alaw
direct_media = no            ; keep media on the PBX so ARI can record/mix
